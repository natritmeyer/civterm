name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.9.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: civterm-linux-x86_64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            artifact: civterm-linux-aarch64
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            artifact: civterm-linux-x86_64-musl
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            artifact: civterm-linux-aarch64-musl
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: civterm-macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: civterm-macos-aarch64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: civterm-windows-x86_64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Ad-hoc sign (macOS)
        if: contains(matrix.target, 'apple-darwin')
        run: codesign --sign - --force --options runtime target/${{ matrix.target }}/release/civterm

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/civterm dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist civterm

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/civterm.exe dist/
          Compress-Archive -Path dist/civterm.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}

  windows-installer:
    name: Windows installer (MSI)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Install WiX toolset
        run: choco install wixtoolset -y

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Generate and build MSI
        run: |
          cargo wix init
          cargo wix

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/wix/*.msi

  packages:
    name: Linux packages (.deb/.rpm) (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cargo deb --target ${{ matrix.target }}
          cargo generate-rpm --target ${{ matrix.target }}

      - name: Collect packages
        run: |
          mkdir -p pkgs
          find target -name '*.deb' -o -name '*.rpm' | xargs -r -I{} cp {} pkgs/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: pkgs/*

  aur:
    name: AUR package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Generate AUR files
        run: ./scripts/generate-aur.sh "${{ steps.tag.outputs.name }}" aur

      - name: Push to AUR (requires AUR_SSH_KEY secret)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "${AUR_SSH_KEY}" ]; then
            echo "AUR_SSH_KEY not set; skipping push"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/civterm.git aur-repo || git clone ssh://aur@aur.archlinux.org/civterm.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "No changes"; else
            git add PKGBUILD .SRCINFO
            git commit -m "Update to ${{ steps.tag.outputs.name }}"
            git push
          fi

      - name: Upload AUR files
        uses: actions/upload-artifact@v4
        with:
          name: aur
          path: aur/*

  release:
    name: Publish release
    needs: [build, packages, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Verify tag matches Cargo.toml version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          CRATE_VERSION="$(grep '^version' Cargo.toml | head -n1 | sed 's/.*= *"\(.*\)"/\1/')"
          echo "tag version: $TAG ; crate version: $CRATE_VERSION"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "ERROR: tag version ($TAG) does not match Cargo.toml version ($CRATE_VERSION)" >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd artifacts
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  verify-formula:
    name: Verify Homebrew formula
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate formula with real hashes
        run: ./scripts/update_formula.sh "${{ steps.tag.outputs.name }}"

      - name: Audit formula
        run: brew audit --strict Formula/civterm.rb

      - name: Test install
        run: brew install --formula Formula/civterm.rb

      - name: Smoke test
        run: civterm --version

  formula:
    name: Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Generate formula from template
        run: ./scripts/update_formula.sh "${{ steps.tag.outputs.name }}"

      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: Formula/civterm.rb