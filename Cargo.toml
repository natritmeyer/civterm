[package]
name = "civterm"
version = "0.9.3"
edition = "2024"
description = "A civ game in your terminal"
license = "MIT"
repository = "https://github.com/natritmeyer/civterm"
authors = ["Nat Ritmeyer"]
publish = false

[package.metadata.deb]
maintainer = "Nat Ritmeyer"
copyright = "2026, Nat Ritmeyer"
license-file = ["LICENSE", "4"]
section = "games"
priority = "optional"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/civterm", dest = "/usr/bin/civterm", mode = "0755" },
]

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }

# Crash reporting on unix: signal-hook catches the faults a panic hook cannot
# see (segfault, abort, stack overflow). Already in the tree via crossterm, so
# naming it here costs no new build.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.release]
tag-name = "v{{version}}"
pre-release-hook = ["make", "build"]
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "v{{version}}"
push = true
publish = false
